services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risk}
      POSTGRES_DB: ${POSTGRES_DB:-riskdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-risk} -d ${POSTGRES_DB:-riskdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations own a service of their own so that *both* the api and the worker wait for
  # them. They used to run inside the api's command, which left the worker free to start,
  # claim a run and query a table the migration had not reached yet. That failure looks
  # like nothing at all: the task dies before it can claim the row, acks_late acks it
  # anyway, and the run sits in `queued` forever with no error on it.
  migrate:
    build: ./backend
    restart: "no"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: alembic upgrade head

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    # Without this the worker dies once — a bad import, an OOM, a migration it raced —
    # and stays dead. Runs then sit in `queued` with no error anywhere, because dispatch
    # succeeded: the message reached Redis and nothing was ever there to take it.
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    # A dead worker has to be visible in `docker compose ps`, not inferred from a stuck
    # run. `inspect ping` exits non-zero when nothing answers on the broker.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -t 10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    # acks_late hands an interrupted run back to the broker, but only if the process gets
    # long enough to release it. The 10s default kills a run mid-iteration on every
    # restart and the message is lost with it.
    stop_grace_period: 60s
    # No --reload equivalent: Celery reloads by restarting, and the compose mount means a
    # `docker compose restart worker` picks up a code change in a second.
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2

  web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
  web_node_modules:
